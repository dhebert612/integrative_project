services:
  vaultwarden:
    build:
      context: .
      dockerfile: vaultwarden.Dockerfile
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.davidhebert.site
      - SIGNUPS_ALLOWED=true
    volumes:
      - vw-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel-token
    secrets:
      - tunnel-token
    depends_on:
      - vaultwarden

  nginx:
    build: 
      context: .
      dockerfile: nginx.Dockerfile
    container_name: nginx
    restart: unless-stopped

secrets:
  tunnel-token:
    file: ./secret.txt

volumes:
  vw-data:

