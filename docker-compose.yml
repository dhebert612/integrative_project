services:
  vaultwarden:
    build:
      context: .
      dockerfile: vaultwarden.Dockerfile
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.davidhebert.site
      - SIGNUPS_ALLOWED=true
    secrets:
    - vaultwarden-password
    volumes:
      - vw-data:/data

  donetick:
    build:
      context: .
      dockerfile: donetick.Dockerfile
    container_name: donetick
    restart: unless-stopped
    volumes:
      - donetick-data:/donetick-data
    environment:
      - DT_ENV=selfhosted
      - DT_SQLITE_PATH=/donetick-data/donetick.db
      - DT_SERVER_CORS_ALLOW_ORIGINS=https://todo.davidhebert.site,https://locahost,http://localhost,http://127.0.0.1
      - DT_SERVER_SERVE_FRONTEND=true
      - TZ=America/Montreal
    secrets:
      - donetick-JWT
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:2021/api/v1/health || exit 1
      start_period: 1m
      timeout: 5s
      interval: 1m
      retries: 3

  portfolio:
    build:
      context: .
      dockerfile: portfolio.Dockerfile
    container_name: portfolio
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel-token
    secrets:
      - tunnel-token
    depends_on:
      - vaultwarden

  homepage:
    build:
      context: .
      dockerfile: homepage.Dockerfile
    container_name: homepage
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  nginx:
    build: 
      context: .
      dockerfile: nginx.Dockerfile
    container_name: nginx
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.6-security-01@sha256:50db91a7064528ad31b56e589ce82cbc80674015dcea7316f38ee338db23c043
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana-password
      - GF_USERS_ALLOW_SIGN_UP=false
    secrets:
      - grafana-password
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3-distroless@sha256:4d2174874988fe0d8356fa5c799210767661a2ffce6bb03cdc64306f6579d7b9
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  node-exporter:
    image: prom/node-exporter:latest@sha256:3ac34ce007accad95afed72149e0d2b927b7e42fd1c866149b945b84737c62c3
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1@sha256:9f6d963bb2b19d706d401cc3e2c3ea8de2f1c471b96a2156ca45e76f650b1625
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://nginx:8081/stub_status'
    depends_on:
      - nginx

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0@sha256:771a65c7877817cd9bb4c2d9eecb9fd1ac56f370287617658c51a35061efa71a
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

secrets:
  tunnel-token:
    file: ./secret.txt
  grafana-password:
    file: ./grafana-password.txt
  vaultwarden-password:
    file: ./vaultwarden-password.txt
  donetick-JWT:
    file: ./donetick-JWT.txt

volumes:
  vw-data:
  prometheus-data:
  grafana-data:
  donetick-data:

