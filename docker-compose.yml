services:
  vaultwarden:
    image: vaultwarden/server:1.35.4-alpine@sha256:34b4e91ed4c2a4d2191245325608b2a84bedbeb9c9dd561e3c0924b98ef7126c
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.davidhebert.site
      - SIGNUPS_ALLOWED=true
    volumes:
      - ./vw-data/:/data/

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - vaultwarden

  nginx:
    build: 
      context: .
      dockerfile: nginx.Dockerfile
    container_name: nginx
    restart: unless-stopped

